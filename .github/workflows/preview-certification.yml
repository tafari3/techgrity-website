name: Candidate Artifact Equivalence Certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: techgrity-candidate-certification-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_SHA: 451f638ff1d48fd2fa8d34c954bf5e71712b534b
  AUDIT_BASE_URL: http://127.0.0.1:4173
  EXPECTED_RELEASE_SHA: 451f638ff1d48fd2fa8d34c954bf5e71712b534b
  AUDIT_CANONICAL_BASE: https://techgrity.co.zw

jobs:
  quality:
    name: Exact source, build and route quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 451f638ff1d48fd2fa8d34c954bf5e71712b534b
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Build and test immutable candidate
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          npm ci
          npm test
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import json, os
          from pathlib import Path
          count=len(list(Path('dist').rglob('*.html')))
          if count != 35: raise SystemExit(f'Expected 35 routes, observed {count}')
          Path('dist/release.json').write_text(json.dumps({'commit':os.environ['PRODUCT_SHA'],'routeCount':count})+'\n')
          PY
          npm start >/tmp/site.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent "$AUDIT_BASE_URL/release.json" && break || sleep 1; done
          curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json"
      - name: Make canonical expectation production-aware
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/post-deployment-regression-audit.py')
          text=path.read_text()
          anchor='BASE = os.environ.get("AUDIT_BASE_URL", "https://techgrity.co.zw").rstrip("/")'
          if 'CANONICAL_BASE =' not in text:
              text=text.replace(anchor,anchor+'\nCANONICAL_BASE = os.environ.get("AUDIT_CANONICAL_BASE", "https://techgrity.co.zw").rstrip("/")')
          text=text.replace('canonical_expected = f"{BASE}{route}"','canonical_expected = f"{CANONICAL_BASE}{route}"')
          path.write_text(text)
          PY
      - name: Audit all 35 rendered routes
        run: |
          set -Eeuo pipefail
          python scripts/exhaustive-live-audit.py
          python scripts/post-deployment-regression-audit.py
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-quality
          path: |
            evidence/exhaustive-live-audit/
            evidence/post-deployment-audit/
          if-no-files-found: warn
          retention-days: 30

  browser-matrix:
    name: ${{ matrix.kind }} ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - kind: visual
            browser: chromium
            lanes: 'desktop-wide:scroll desktop:scroll desktop-compact:scroll tablet-landscape:scroll tablet-portrait:scroll mobile:scroll mobile-narrow:scroll'
          - kind: visual
            browser: firefox
            lanes: 'desktop:full-only mobile:full-only'
          - kind: visual
            browser: webkit
            lanes: 'desktop:full-only mobile:full-only'
          - kind: interaction
            browser: chromium
            lanes: 'desktop tablet-landscape tablet-portrait mobile mobile-narrow'
          - kind: interaction
            browser: firefox
            lanes: 'desktop mobile'
          - kind: interaction
            browser: webkit
            lanes: 'desktop mobile'
          - kind: pointer
            browser: chromium
            lanes: 'tablet-landscape tablet-portrait mobile mobile-narrow'
          - kind: pointer
            browser: firefox
            lanes: 'mobile'
          - kind: pointer
            browser: webkit
            lanes: 'mobile'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 451f638ff1d48fd2fa8d34c954bf5e71712b534b
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Build exact candidate and install browser
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          npm ci
          npm test
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps "${{ matrix.browser }}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          count=len(list(Path('dist').rglob('*.html')))
          if count != 35: raise SystemExit(f'Expected 35 routes, observed {count}')
          Path('dist/release.json').write_text(json.dumps({'commit':os.environ['PRODUCT_SHA'],'routeCount':count})+'\n')
          PY
          npm start >/tmp/site.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent "$AUDIT_BASE_URL/release.json" && break || sleep 1; done
          curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json"
      - name: Exercise grouped lanes
        run: |
          set -Eeuo pipefail
          case '${{ matrix.kind }}' in
            visual)
              for lane in ${{ matrix.lanes }}; do
                viewport="${lane%%:*}"; mode="${lane##*:}"
                AUDIT_BROWSER='${{ matrix.browser }}' AUDIT_VIEWPORT="$viewport" AUDIT_CAPTURE_MODE="$mode" python scripts/manual-visual-capture.py
              done
              ;;
            interaction)
              for viewport in ${{ matrix.lanes }}; do
                AUDIT_BROWSER='${{ matrix.browser }}' AUDIT_VIEWPORT="$viewport" python scripts/manual-interaction-recapture.py
              done
              ;;
            pointer)
              for viewport in ${{ matrix.lanes }}; do
                AUDIT_BROWSER='${{ matrix.browser }}' AUDIT_VIEWPORT="$viewport" python scripts/manual-pointer-navigation-all-routes.py
              done
              ;;
            *) exit 2 ;;
          esac
      - name: Assert grouped manifests
        env:
          AUDIT_KIND: ${{ matrix.kind }}
          AUDIT_BROWSER_NAME: ${{ matrix.browser }}
          AUDIT_LANES: ${{ matrix.lanes }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          kind=os.environ['AUDIT_KIND']
          browser=os.environ['AUDIT_BROWSER_NAME']
          expected=len(os.environ['AUDIT_LANES'].split())
          roots={
              'visual':Path('evidence/manual-visual'),
              'interaction':Path('evidence/manual-interaction-recapture'),
              'pointer':Path('evidence/manual-pointer-navigation'),
          }
          manifests=sorted((roots[kind]/browser).glob('*/manifest.json'))
          failures=[]
          if len(manifests)!=expected:
              failures.append({'code':'manifest-count','expected':expected,'actual':len(manifests)})

          def pixels(value):
              match=re.fullmatch(r'(-?\d+(?:\.\d+)?)px',str(value or ''))
              return float(match.group(1)) if match else None
          def intersects(rect,width,height):
              return bool(rect and rect['right']>0 and rect['left']<width and rect['bottom']>0 and rect['top']<height)

          for path in manifests:
              data=json.loads(path.read_text())
              records=data.get('records',[])
              if data.get('expectedReleaseSha')!=os.environ['PRODUCT_SHA']:
                  failures.append({'path':str(path),'code':'release-sha'})
              if len(records)!=35 or data.get('errorCount',0):
                  failures.append({'path':str(path),'code':'result','records':len(records),'errors':data.get('errorCount')})
              if kind=='visual':
                  for record in records:
                      metrics=record.get('finalMetrics',{})
                      if metrics.get('scrollWidth',0)>metrics.get('clientWidth',0)+1:
                          failures.append({'path':str(path),'route':record.get('route'),'code':'horizontal-overflow'})
              if kind=='pointer':
                  viewport=data.get('viewport',{})
                  for record in records:
                      for state in record.get('states',[]):
                          before=state.get('before',{}); opened=state.get('opened',{}); closed=state.get('closed',{})
                          before_y=before.get('scrollY',0)
                          opened_styles=opened.get('bodyInlineStyles',{}); closed_styles=closed.get('bodyInlineStyles',{})
                          context={'path':str(path),'route':record.get('route'),'position':state.get('position')}
                          def fail(code): failures.append({**context,'code':code})
                          if opened.get('expanded')!='true' or not opened.get('navOpenClass') or not opened.get('intersectsViewport'): fail('open-state')
                          if not intersects(opened.get('toggleRect'),viewport.get('width',0),viewport.get('height',0)): fail('open-toggle-hidden')
                          if len(opened.get('allTopItems',[]))<8 or opened.get('visibleTopItems',[])!=opened.get('allTopItems',[]): fail('hidden-items')
                          saved=opened.get('bodyDatasetScrollY'); top=pixels(opened_styles.get('top'))
                          if not opened.get('bodyLocked') or opened_styles.get('position')!='fixed': fail('lock-state')
                          if saved is None or abs(float(saved)-before_y)>1: fail('lock-saved-scroll')
                          if top is None or abs(top+before_y)>1: fail('lock-offset')
                          before_anchor=before.get('anchorRect'); opened_anchor=opened.get('anchorRect')
                          if not before_anchor or not opened_anchor or before.get('anchorToken')!=opened.get('anchorToken'): fail('anchor-missing')
                          elif abs(opened_anchor['top']-before_anchor['top'])>1 or abs(opened_anchor['left']-before_anchor['left'])>1: fail('anchor-moved-open')
                          if closed.get('expanded')!='false' or closed.get('navOpenClass') or closed.get('bodyLocked'): fail('close-state')
                          if closed.get('bodyDatasetScrollY') is not None or any(closed_styles.values()): fail('lock-styles-retained')
                          if not closed.get('activeIsMenuToggle'): fail('focus-not-returned')
                          if abs(closed.get('scrollY',0)-before_y)>1: fail('scroll-not-restored')
                          closed_anchor=closed.get('anchorRect')
                          if not before_anchor or not closed_anchor or abs(closed_anchor['top']-before_anchor['top'])>1 or abs(closed_anchor['left']-before_anchor['left'])>1: fail('anchor-moved-close')
          summary={'kind':kind,'browser':browser,'manifestCount':len(manifests),'failures':failures}
          out=Path(f'evidence/candidate-{kind}-{browser}-summary.json')
          out.write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          if failures: raise SystemExit(f'{len(failures)} certification failure(s)')
          PY
      - name: Upload grouped evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.kind }}-${{ matrix.browser }}
          path: |
            evidence/manual-visual/${{ matrix.browser }}/
            evidence/manual-interaction-recapture/${{ matrix.browser }}/
            evidence/manual-pointer-navigation/${{ matrix.browser }}/
            evidence/candidate-${{ matrix.kind }}-${{ matrix.browser }}-summary.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  certification:
    name: Candidate certification summary
    runs-on: ubuntu-latest
    needs: [quality, browser-matrix]
    if: always()
    steps:
      - name: Enforce complete candidate certification
        env:
          QUALITY: ${{ needs.quality.result }}
          MATRIX: ${{ needs.browser-matrix.result }}
        run: |
          set -Eeuo pipefail
          echo "quality=$QUALITY matrix=$MATRIX"
          test "$QUALITY" = success
          test "$MATRIX" = success
          echo "CANDIDATE_ARTIFACT_CERTIFIED_SHA=$PRODUCT_SHA"
          echo "PREVIEW_DEPLOYMENT_STATUS=pending-new-preview"
