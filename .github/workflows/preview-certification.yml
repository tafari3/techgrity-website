name: Corrected Preview Certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: techgrity-preview-certification-${{ github.ref }}
  cancel-in-progress: true

env:
  AUDIT_BASE_URL: https://techgrity-systems-live-lp1upmikc-tafarac3-7447s-projects.vercel.app
  EXPECTED_RELEASE_SHA: 8169401ad3f46f71f495ce0df9a8885f52b6a47f
  AUDIT_CANONICAL_BASE: https://techgrity.co.zw

jobs:
  quality:
    name: Quality accessibility and delivery
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install audit dependencies
        run: |
          set -Eeuo pipefail
          npm ci
          npm install --no-save axe-core@4.10.3
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Verify preview release marker
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url=os.environ['AUDIT_BASE_URL'].rstrip('/')+'/release.json'
          with urllib.request.urlopen(url,timeout=30) as response: payload=json.load(response)
          print(json.dumps(payload,indent=2))
          if payload.get('commit')!=os.environ['EXPECTED_RELEASE_SHA']:
              raise SystemExit('Preview release SHA mismatch')
          PY
      - name: Make canonical expectation preview-aware
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/post-deployment-regression-audit.py')
          text=path.read_text()
          anchor='BASE = os.environ.get("AUDIT_BASE_URL", "https://techgrity.co.zw").rstrip("/")'
          text=text.replace(anchor,anchor+'\nCANONICAL_BASE = os.environ.get("AUDIT_CANONICAL_BASE", "https://techgrity.co.zw").rstrip("/")')
          text=text.replace('canonical_expected = f"{BASE}{route}"','canonical_expected = f"{CANONICAL_BASE}{route}"')
          path.write_text(text)
          PY
      - name: Run exhaustive browser and quality matrices
        run: |
          set -Eeuo pipefail
          python scripts/exhaustive-live-audit.py
          python scripts/post-deployment-regression-audit.py
          python scripts/production-quality-audit.py
          python scripts/normalize-production-audit.py
      - name: Classify normalized preview findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('evidence/normalized-production-audit/summary.json').read_text())
          findings=json.loads(Path('evidence/normalized-production-audit/findings.json').read_text())
          result={'summary':summary,'findingCount':len(findings),'findings':findings}
          Path('evidence/preview-quality-classification.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          severity=summary.get('severityCounts',{})
          if any(severity.get(level,0) for level in ('critical','high')):
              raise SystemExit('Corrected preview retains blocking quality findings')
          PY
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-preview-quality
          path: |
            evidence/exhaustive-live-audit/
            evidence/post-deployment-audit/
            evidence/production-quality-audit/
            evidence/normalized-production-audit/
            evidence/preview-quality-classification.json
          if-no-files-found: error
          retention-days: 30

  visual:
    name: Visual ${{ matrix.browser }} / ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {browser: chromium, viewport: desktop-wide, mode: scroll}
          - {browser: chromium, viewport: desktop, mode: scroll}
          - {browser: chromium, viewport: desktop-compact, mode: scroll}
          - {browser: chromium, viewport: tablet-landscape, mode: scroll}
          - {browser: chromium, viewport: tablet-portrait, mode: scroll}
          - {browser: chromium, viewport: mobile, mode: scroll}
          - {browser: chromium, viewport: mobile-narrow, mode: scroll}
          - {browser: firefox, viewport: desktop, mode: full-only}
          - {browser: firefox, viewport: mobile, mode: full-only}
          - {browser: webkit, viewport: desktop, mode: full-only}
          - {browser: webkit, viewport: mobile, mode: full-only}
    env:
      AUDIT_BROWSER: ${{ matrix.browser }}
      AUDIT_VIEWPORT: ${{ matrix.viewport }}
      AUDIT_CAPTURE_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install browser
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps "${AUDIT_BROWSER}"
      - name: Capture every route and scroll state
        run: python scripts/manual-visual-capture.py
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-preview-visual-${{ matrix.browser }}-${{ matrix.viewport }}
          path: evidence/manual-visual/${{ matrix.browser }}/${{ matrix.viewport }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  interactions:
    name: Interaction ${{ matrix.browser }} / ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {browser: chromium, viewport: desktop}
          - {browser: firefox, viewport: desktop}
          - {browser: webkit, viewport: desktop}
          - {browser: chromium, viewport: tablet-landscape}
          - {browser: chromium, viewport: tablet-portrait}
          - {browser: chromium, viewport: mobile}
          - {browser: chromium, viewport: mobile-narrow}
          - {browser: firefox, viewport: mobile}
          - {browser: webkit, viewport: mobile}
    env:
      AUDIT_BROWSER: ${{ matrix.browser }}
      AUDIT_VIEWPORT: ${{ matrix.viewport }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install browser
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps "${AUDIT_BROWSER}"
      - name: Recapture asserted interaction states
        run: python scripts/manual-interaction-recapture.py
      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-preview-interaction-${{ matrix.browser }}-${{ matrix.viewport }}
          path: evidence/manual-interaction-recapture/${{ matrix.browser }}/${{ matrix.viewport }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  pointer-navigation:
    name: Pointer ${{ matrix.browser }} / ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {browser: chromium, viewport: tablet-landscape}
          - {browser: chromium, viewport: tablet-portrait}
          - {browser: chromium, viewport: mobile}
          - {browser: chromium, viewport: mobile-narrow}
          - {browser: firefox, viewport: mobile}
          - {browser: webkit, viewport: mobile}
    env:
      AUDIT_BROWSER: ${{ matrix.browser }}
      AUDIT_VIEWPORT: ${{ matrix.viewport }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install browser
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps "${AUDIT_BROWSER}"
      - name: Make pointer matrix preview-aware
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/manual-pointer-navigation-all-routes.py')
          text=path.read_text()
          text=text.replace('BASE_URL = "https://techgrity.co.zw"','BASE_URL = os.environ["AUDIT_BASE_URL"].rstrip("/")')
          text=text.replace('EXPECTED_RELEASE_SHA = "a729d9f1df31acd9835bad9ee7b78408bf3d9672"','EXPECTED_RELEASE_SHA = os.environ["EXPECTED_RELEASE_SHA"]')
          path.write_text(text)
          PY
      - name: Exercise real pointer navigation on every route
        run: python scripts/manual-pointer-navigation-all-routes.py
      - name: Assert corrected navigation behavior
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('evidence/manual-pointer-navigation')/os.environ['AUDIT_BROWSER']/os.environ['AUDIT_VIEWPORT']/ 'manifest.json'
          data=json.loads(path.read_text())
          failures=[]
          for record in data['records']:
              for state in record.get('states',[]):
                  opened,closed,before=state['opened'],state['closed'],state['before']
                  if opened.get('expanded')!='true' or not opened.get('navOpenClass') or not opened.get('intersectsViewport'):
                      failures.append({'route':record['route'],'position':state['position'],'code':'open-state','state':state})
                  if len(opened.get('visibleTopItems',[]))<8:
                      failures.append({'route':record['route'],'position':state['position'],'code':'hidden-items','state':state})
                  if state['position']=='middle' and before.get('scrollY',0)>0:
                      if opened.get('scrollY')!=before.get('scrollY') or closed.get('scrollY')!=before.get('scrollY'):
                          failures.append({'route':record['route'],'position':'middle','code':'scroll-not-preserved','before':before.get('scrollY'),'opened':opened.get('scrollY'),'closed':closed.get('scrollY')})
                  if closed.get('expanded')!='false' or closed.get('navOpenClass'):
                      failures.append({'route':record['route'],'position':state['position'],'code':'close-state','state':state})
          print(json.dumps({'failures':failures},indent=2))
          if failures: raise SystemExit(f'{len(failures)} pointer-navigation failures')
          PY
      - name: Upload pointer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-preview-pointer-${{ matrix.browser }}-${{ matrix.viewport }}
          path: evidence/manual-pointer-navigation/${{ matrix.browser }}/${{ matrix.viewport }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
