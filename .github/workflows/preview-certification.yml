name: Exact Artifact Equivalence Certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: techgrity-artifact-certification-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_SHA: 62caa0a773bb8a95bdab4edda2a6963a640a9fbd
  AUDIT_BASE_URL: http://127.0.0.1:4173
  EXPECTED_RELEASE_SHA: 62caa0a773bb8a95bdab4edda2a6963a640a9fbd
  AUDIT_CANONICAL_BASE: https://techgrity.co.zw
  CERTIFIED_DEPLOYMENT_ID: dpl_8p7FVZCSpiy14RwXxBNqaQUFijtC
  CERTIFIED_DEPLOYMENT_URL: https://techgrity-systems-live-iy0yc3v8f-tafarac3-7447s-projects.vercel.app

jobs:
  quality:
    name: Exact source, build and route quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout immutable product source
        uses: actions/checkout@v4
        with:
          ref: 62caa0a773bb8a95bdab4edda2a6963a640a9fbd

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Build and test immutable source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          npm ci
          npm test
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Materialize exact local release marker
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          html_count = len(list(Path("dist").rglob("*.html")))
          if html_count != 35:
              raise SystemExit(f"Expected 35 rendered routes, observed {html_count}")
          marker = {
              "commit": os.environ["PRODUCT_SHA"],
              "source": "tafari3/techgrity-website",
              "environment": "artifact-equivalence",
              "routeCount": html_count,
          }
          Path("dist/release.json").write_text(json.dumps(marker, indent=2) + "\n")
          PY

      - name: Start exact local artifact
        run: |
          set -Eeuo pipefail
          npm start >/tmp/techgrity-artifact-server.log 2>&1 &
          echo $! >/tmp/techgrity-artifact-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json" >/tmp/release.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/release.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          marker = json.loads(Path("/tmp/release.json").read_text())
          if marker.get("commit") != os.environ["PRODUCT_SHA"]:
              raise SystemExit("Local artifact release mismatch")
          if marker.get("routeCount") != 35:
              raise SystemExit("Local artifact route-count mismatch")
          print(json.dumps(marker, indent=2))
          PY

      - name: Make canonical expectation deployment-aware
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/post-deployment-regression-audit.py")
          text = path.read_text()
          anchor = 'BASE = os.environ.get("AUDIT_BASE_URL", "https://techgrity.co.zw").rstrip("/")'
          replacement = anchor + '\nCANONICAL_BASE = os.environ.get("AUDIT_CANONICAL_BASE", "https://techgrity.co.zw").rstrip("/")'
          if "CANONICAL_BASE =" not in text:
              text = text.replace(anchor, replacement)
          text = text.replace(
              'canonical_expected = f"{BASE}{route}"',
              'canonical_expected = f"{CANONICAL_BASE}{route}"',
          )
          path.write_text(text)
          PY

      - name: Audit all rendered routes
        run: |
          set -Eeuo pipefail
          python scripts/exhaustive-live-audit.py
          python scripts/post-deployment-regression-audit.py

      - name: Write artifact-linkage record
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          record = {
              "status": "pass",
              "certifiedAt": datetime.now(timezone.utc).isoformat(),
              "productSha": os.environ["PRODUCT_SHA"],
              "deploymentId": os.environ["CERTIFIED_DEPLOYMENT_ID"],
              "deploymentUrl": os.environ["CERTIFIED_DEPLOYMENT_URL"],
              "routeCount": 35,
              "method": "immutable-source rebuild plus complete local browser matrix",
              "liveDeploymentEvidence": "Vercel build-log provenance and exact-preview capture artifacts",
          }
          Path("evidence/artifact-equivalence-linkage.json").write_text(
              json.dumps(record, indent=2) + "\n"
          )
          print(json.dumps(record, indent=2))
          PY

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-equivalence-quality
          path: |
            evidence/exhaustive-live-audit/
            evidence/post-deployment-audit/
            evidence/artifact-equivalence-linkage.json
          if-no-files-found: warn
          retention-days: 30

      - name: Show server diagnostics on failure
        if: failure()
        run: tail -n 200 /tmp/techgrity-artifact-server.log || true

  visual:
    name: Visual ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            viewports: 'desktop-wide:scroll desktop:scroll desktop-compact:scroll tablet-landscape:scroll tablet-portrait:scroll mobile:scroll mobile-narrow:scroll'
          - browser: firefox
            viewports: 'desktop:full-only mobile:full-only'
          - browser: webkit
            viewports: 'desktop:full-only mobile:full-only'
    steps:
      - name: Checkout immutable product source
        uses: actions/checkout@v4
        with:
          ref: 62caa0a773bb8a95bdab4edda2a6963a640a9fbd
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Build exact artifact and install browser
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          npm ci
          npm test
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps "${{ matrix.browser }}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          html_count = len(list(Path("dist").rglob("*.html")))
          if html_count != 35:
              raise SystemExit(f"Expected 35 routes, observed {html_count}")
          Path("dist/release.json").write_text(json.dumps({
              "commit": os.environ["PRODUCT_SHA"],
              "source": "tafari3/techgrity-website",
              "environment": "artifact-equivalence",
              "routeCount": html_count,
          }) + "\n")
          PY
      - name: Start exact local artifact
        run: |
          set -Eeuo pipefail
          npm start >/tmp/techgrity-artifact-server.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent "$AUDIT_BASE_URL/release.json" && break
            sleep 1
          done
          curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json"
      - name: Capture visual lanes
        run: |
          set -Eeuo pipefail
          for item in ${{ matrix.viewports }}; do
            viewport="${item%%:*}"
            mode="${item##*:}"
            echo "VISUAL_LANE browser=${{ matrix.browser }} viewport=$viewport mode=$mode"
            AUDIT_BROWSER="${{ matrix.browser }}" AUDIT_VIEWPORT="$viewport" AUDIT_CAPTURE_MODE="$mode" \
              python scripts/manual-visual-capture.py
          done
      - name: Assert visual manifests
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          browser = "${{ matrix.browser }}"
          manifests = sorted((Path("evidence/manual-visual") / browser).glob("*/manifest.json"))
          expected = len("${{ matrix.viewports }}".split())
          failures = []
          summaries = []
          if len(manifests) != expected:
              failures.append({"code": "manifest-count", "expected": expected, "actual": len(manifests)})
          for path in manifests:
              data = json.loads(path.read_text())
              records = data.get("records", [])
              if data.get("expectedReleaseSha") != os.environ["PRODUCT_SHA"]:
                  failures.append({"path": str(path), "code": "release-sha"})
              if len(records) != 35 or data.get("errorCount", 0):
                  failures.append({"path": str(path), "code": "capture-result", "records": len(records), "errors": data.get("errorCount")})
              for record in records:
                  metrics = record.get("finalMetrics", {})
                  if metrics.get("scrollWidth", 0) > metrics.get("clientWidth", 0) + 1:
                      failures.append({"path": str(path), "route": record.get("route"), "code": "horizontal-overflow"})
              summaries.append({"path": str(path), "records": len(records), "errors": data.get("errorCount", 0)})
          result = {"browser": browser, "lanes": summaries, "failures": failures}
          Path(f"evidence/visual-{browser}-summary.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          if failures:
              raise SystemExit(f"{len(failures)} visual certification failure(s)")
          PY
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-equivalence-visual-${{ matrix.browser }}
          path: |
            evidence/manual-visual/${{ matrix.browser }}/
            evidence/visual-${{ matrix.browser }}-summary.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  interaction:
    name: Interaction ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            viewports: 'desktop tablet-landscape tablet-portrait mobile mobile-narrow'
          - browser: firefox
            viewports: 'desktop mobile'
          - browser: webkit
            viewports: 'desktop mobile'
    steps:
      - name: Checkout immutable product source
        uses: actions/checkout@v4
        with:
          ref: 62caa0a773bb8a95bdab4edda2a6963a640a9fbd
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Build exact artifact and install browser
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          npm ci
          npm test
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps "${{ matrix.browser }}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          html_count = len(list(Path("dist").rglob("*.html")))
          if html_count != 35:
              raise SystemExit(f"Expected 35 routes, observed {html_count}")
          Path("dist/release.json").write_text(json.dumps({"commit": os.environ["PRODUCT_SHA"], "routeCount": html_count}) + "\n")
          PY
      - name: Start exact local artifact
        run: |
          set -Eeuo pipefail
          npm start >/tmp/techgrity-artifact-server.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent "$AUDIT_BASE_URL/release.json" && break || sleep 1; done
          curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json"
      - name: Exercise interaction lanes
        run: |
          set -Eeuo pipefail
          for viewport in ${{ matrix.viewports }}; do
            echo "INTERACTION_LANE browser=${{ matrix.browser }} viewport=$viewport"
            AUDIT_BROWSER="${{ matrix.browser }}" AUDIT_VIEWPORT="$viewport" \
              python scripts/manual-interaction-recapture.py
          done
      - name: Assert interaction manifests
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          browser = "${{ matrix.browser }}"
          manifests = sorted((Path("evidence/manual-interaction-recapture") / browser).glob("*/manifest.json"))
          expected = len("${{ matrix.viewports }}".split())
          failures = []
          summaries = []
          if len(manifests) != expected:
              failures.append({"code": "manifest-count", "expected": expected, "actual": len(manifests)})
          for path in manifests:
              data = json.loads(path.read_text())
              records = data.get("records", [])
              if data.get("expectedReleaseSha") != os.environ["PRODUCT_SHA"]:
                  failures.append({"path": str(path), "code": "release-sha"})
              if len(records) != 35 or data.get("errorCount", 0):
                  failures.append({"path": str(path), "code": "interaction-result", "records": len(records), "errors": data.get("errorCount")})
              summaries.append({"path": str(path), "records": len(records), "errors": data.get("errorCount", 0)})
          result = {"browser": browser, "lanes": summaries, "failures": failures}
          Path(f"evidence/interaction-{browser}-summary.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          if failures:
              raise SystemExit(f"{len(failures)} interaction certification failure(s)")
          PY
      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-equivalence-interaction-${{ matrix.browser }}
          path: |
            evidence/manual-interaction-recapture/${{ matrix.browser }}/
            evidence/interaction-${{ matrix.browser }}-summary.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  pointer:
    name: Pointer ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            viewports: 'tablet-landscape tablet-portrait mobile mobile-narrow'
          - browser: firefox
            viewports: 'mobile'
          - browser: webkit
            viewports: 'mobile'
    steps:
      - name: Checkout immutable product source
        uses: actions/checkout@v4
        with:
          ref: 62caa0a773bb8a95bdab4edda2a6963a640a9fbd
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Build exact artifact and install browser
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          npm ci
          npm test
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps "${{ matrix.browser }}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          html_count = len(list(Path("dist").rglob("*.html")))
          if html_count != 35:
              raise SystemExit(f"Expected 35 routes, observed {html_count}")
          Path("dist/release.json").write_text(json.dumps({"commit": os.environ["PRODUCT_SHA"], "routeCount": html_count}) + "\n")
          PY
      - name: Start exact local artifact
        run: |
          set -Eeuo pipefail
          npm start >/tmp/techgrity-artifact-server.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent "$AUDIT_BASE_URL/release.json" && break || sleep 1; done
          curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json"
      - name: Exercise pointer lanes
        run: |
          set -Eeuo pipefail
          for viewport in ${{ matrix.viewports }}; do
            echo "POINTER_LANE browser=${{ matrix.browser }} viewport=$viewport"
            AUDIT_BROWSER="${{ matrix.browser }}" AUDIT_VIEWPORT="$viewport" \
              python scripts/manual-pointer-navigation-all-routes.py
          done
      - name: Assert pointer manifests
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          browser = "${{ matrix.browser }}"
          manifests = sorted((Path("evidence/manual-pointer-navigation") / browser).glob("*/manifest.json"))
          expected = len("${{ matrix.viewports }}".split())
          failures = []
          summaries = []

          def pixels(value):
              match = re.fullmatch(r"(-?\d+(?:\.\d+)?)px", str(value or ""))
              return float(match.group(1)) if match else None

          def intersects(rect, width, height):
              return bool(rect and rect["right"] > 0 and rect["left"] < width and rect["bottom"] > 0 and rect["top"] < height)

          if len(manifests) != expected:
              failures.append({"code": "manifest-count", "expected": expected, "actual": len(manifests)})

          for path in manifests:
              data = json.loads(path.read_text())
              records = data.get("records", [])
              viewport = data.get("viewport", {})
              if data.get("expectedReleaseSha") != os.environ["PRODUCT_SHA"]:
                  failures.append({"path": str(path), "code": "release-sha"})
              if len(records) != 35 or data.get("errorCount", 0):
                  failures.append({"path": str(path), "code": "pointer-result", "records": len(records), "errors": data.get("errorCount")})

              for record in records:
                  for state in record.get("states", []):
                      route = record.get("route")
                      position = state.get("position")
                      before = state.get("before", {})
                      opened = state.get("opened", {})
                      closed = state.get("closed", {})
                      before_y = before.get("scrollY", 0)
                      opened_styles = opened.get("bodyInlineStyles", {})
                      closed_styles = closed.get("bodyInlineStyles", {})

                      def fail(code, **detail):
                          failures.append({"path": str(path), "route": route, "position": position, "code": code, **detail})

                      if opened.get("expanded") != "true" or not opened.get("navOpenClass") or not opened.get("intersectsViewport"):
                          fail("open-state")
                      if not intersects(opened.get("toggleRect"), viewport.get("width", 0), viewport.get("height", 0)):
                          fail("open-toggle-hidden")
                      if len(opened.get("allTopItems", [])) < 8 or opened.get("visibleTopItems", []) != opened.get("allTopItems", []):
                          fail("hidden-items")

                      dataset_y = opened.get("bodyDatasetScrollY")
                      top_px = pixels(opened_styles.get("top"))
                      if not opened.get("bodyLocked") or opened_styles.get("position") != "fixed":
                          fail("lock-state")
                      if dataset_y is None or abs(float(dataset_y) - before_y) > 1:
                          fail("lock-saved-scroll")
                      if top_px is None or abs(top_px + before_y) > 1:
                          fail("lock-offset")

                      before_anchor = before.get("anchorRect")
                      opened_anchor = opened.get("anchorRect")
                      if not before_anchor or not opened_anchor or before.get("anchorToken") != opened.get("anchorToken"):
                          fail("anchor-missing")
                      elif abs(opened_anchor["top"] - before_anchor["top"]) > 1 or abs(opened_anchor["left"] - before_anchor["left"]) > 1:
                          fail("anchor-moved-open")

                      if closed.get("expanded") != "false" or closed.get("navOpenClass") or closed.get("bodyLocked"):
                          fail("close-state")
                      if closed.get("bodyDatasetScrollY") is not None or any(closed_styles.values()):
                          fail("lock-styles-retained")
                      if not closed.get("activeIsMenuToggle"):
                          fail("focus-not-returned")
                      if abs(closed.get("scrollY", 0) - before_y) > 1:
                          fail("scroll-not-restored")

                      closed_anchor = closed.get("anchorRect")
                      if not before_anchor or not closed_anchor or abs(closed_anchor["top"] - before_anchor["top"]) > 1 or abs(closed_anchor["left"] - before_anchor["left"]) > 1:
                          fail("anchor-moved-close")

              summaries.append({"path": str(path), "records": len(records), "errors": data.get("errorCount", 0)})

          result = {"browser": browser, "lanes": summaries, "failures": failures}
          Path(f"evidence/pointer-{browser}-summary.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          if failures:
              raise SystemExit(f"{len(failures)} pointer certification failure(s)")
          PY
      - name: Upload pointer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-equivalence-pointer-${{ matrix.browser }}
          path: |
            evidence/manual-pointer-navigation/${{ matrix.browser }}/
            evidence/pointer-${{ matrix.browser }}-summary.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  certification:
    name: Artifact-equivalence certification summary
    runs-on: ubuntu-latest
    needs: [quality, visual, interaction, pointer]
    if: always()
    steps:
      - name: Enforce complete certification
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
          INTERACTION_RESULT: ${{ needs.interaction.result }}
          POINTER_RESULT: ${{ needs.pointer.result }}
        run: |
          set -Eeuo pipefail
          printf 'quality=%s\nvisual=%s\ninteraction=%s\npointer=%s\n' \
            "$QUALITY_RESULT" "$VISUAL_RESULT" "$INTERACTION_RESULT" "$POINTER_RESULT"
          test "$QUALITY_RESULT" = success
          test "$VISUAL_RESULT" = success
          test "$INTERACTION_RESULT" = success
          test "$POINTER_RESULT" = success
          echo "ARTIFACT_EQUIVALENCE_CERTIFIED_SHA=$PRODUCT_SHA"
          echo "LINKED_VERCEL_DEPLOYMENT=$CERTIFIED_DEPLOYMENT_ID"
