name: Corrected Preview Certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: techgrity-preview-certification-${{ github.ref }}
  cancel-in-progress: true

env:
  AUDIT_UPSTREAM_URL: https://techgrity-systems-live-iy0yc3v8f-tafarac3-7447s-projects.vercel.app
  VERCEL_SHARE_URL: https://techgrity-systems-live-iy0yc3v8f-tafarac3-7447s-projects.vercel.app/?_vercel_share=UvRXX8egeqgsgLsp0Pnm5m7Gg2z5Qltd
  AUDIT_BASE_URL: http://127.0.0.1:4180
  EXPECTED_RELEASE_SHA: 62caa0a773bb8a95bdab4edda2a6963a640a9fbd
  AUDIT_CANONICAL_BASE: https://techgrity.co.zw

jobs:
  quality:
    name: Quality accessibility and delivery
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install audit dependencies
        run: |
          set -Eeuo pipefail
          npm ci
          npm install --no-save axe-core@4.10.3
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Start authenticated preview proxy
        run: |
          set -Eeuo pipefail
          python scripts/vercel-share-proxy.py >/tmp/techgrity-preview-proxy.log 2>&1 &
          echo $! >/tmp/techgrity-preview-proxy.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json" >/tmp/release.json; then break; fi
            sleep 1
          done
          cat /tmp/release.json
      - name: Verify preview release marker
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url=os.environ['AUDIT_BASE_URL'].rstrip('/')+'/release.json'
          with urllib.request.urlopen(url,timeout=30) as response: payload=json.load(response)
          print(json.dumps(payload,indent=2))
          if payload.get('commit')!=os.environ['EXPECTED_RELEASE_SHA']:
              raise SystemExit('Preview release SHA mismatch')
          PY
      - name: Make canonical expectation preview-aware
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/post-deployment-regression-audit.py')
          text=path.read_text()
          anchor='BASE = os.environ.get("AUDIT_BASE_URL", "https://techgrity.co.zw").rstrip("/")'
          text=text.replace(anchor,anchor+'\nCANONICAL_BASE = os.environ.get("AUDIT_CANONICAL_BASE", "https://techgrity.co.zw").rstrip("/")')
          text=text.replace('canonical_expected = f"{BASE}{route}"','canonical_expected = f"{CANONICAL_BASE}{route}"')
          path.write_text(text)
          PY
      - name: Run exhaustive browser and quality matrices
        run: |
          set -Eeuo pipefail
          python scripts/exhaustive-live-audit.py
          python scripts/post-deployment-regression-audit.py
          python scripts/production-quality-audit.py
          python scripts/normalize-production-audit.py
      - name: Classify normalized preview findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('evidence/normalized-production-audit/summary.json').read_text())
          findings=json.loads(Path('evidence/normalized-production-audit/findings.json').read_text())
          result={'summary':summary,'findingCount':len(findings),'findings':findings}
          Path('evidence/preview-quality-classification.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          severity=summary.get('severityCounts',{})
          if any(severity.get(level,0) for level in ('critical','high')):
              raise SystemExit('Corrected preview retains blocking quality findings')
          PY
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-preview-quality
          path: |
            evidence/exhaustive-live-audit/
            evidence/post-deployment-audit/
            evidence/production-quality-audit/
            evidence/normalized-production-audit/
            evidence/preview-quality-classification.json
          if-no-files-found: error
          retention-days: 30

  visual:
    name: Visual ${{ matrix.browser }} / ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {browser: chromium, viewport: desktop-wide, mode: scroll}
          - {browser: chromium, viewport: desktop, mode: scroll}
          - {browser: chromium, viewport: desktop-compact, mode: scroll}
          - {browser: chromium, viewport: tablet-landscape, mode: scroll}
          - {browser: chromium, viewport: tablet-portrait, mode: scroll}
          - {browser: chromium, viewport: mobile, mode: scroll}
          - {browser: chromium, viewport: mobile-narrow, mode: scroll}
          - {browser: firefox, viewport: desktop, mode: full-only}
          - {browser: firefox, viewport: mobile, mode: full-only}
          - {browser: webkit, viewport: desktop, mode: full-only}
          - {browser: webkit, viewport: mobile, mode: full-only}
    env:
      AUDIT_BROWSER: ${{ matrix.browser }}
      AUDIT_VIEWPORT: ${{ matrix.viewport }}
      AUDIT_CAPTURE_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install browser
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps "$AUDIT_BROWSER"
      - name: Start authenticated preview proxy
        run: |
          set -Eeuo pipefail
          python scripts/vercel-share-proxy.py >/tmp/techgrity-preview-proxy.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json"
      - name: Capture every route and scroll state
        run: python scripts/manual-visual-capture.py
      - name: Assert no horizontal viewport overflow
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('evidence/manual-visual')/os.environ['AUDIT_BROWSER']/os.environ['AUDIT_VIEWPORT']/'manifest.json'
          data=json.loads(path.read_text())
          failures=[]
          for record in data.get('records',[]):
              metrics=record.get('finalMetrics',{})
              scroll_width=metrics.get('scrollWidth',0)
              client_width=metrics.get('clientWidth',0)
              if scroll_width>client_width+1:
                  failures.append({'route':record.get('route'),'scrollWidth':scroll_width,'clientWidth':client_width})
          print(json.dumps({'failures':failures},indent=2))
          if failures: raise SystemExit(f'{len(failures)} horizontal-overflow failures')
          PY
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-preview-visual-${{ matrix.browser }}-${{ matrix.viewport }}
          path: evidence/manual-visual/${{ matrix.browser }}/${{ matrix.viewport }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  interactions:
    name: Interaction ${{ matrix.browser }} / ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {browser: chromium, viewport: desktop}
          - {browser: firefox, viewport: desktop}
          - {browser: webkit, viewport: desktop}
          - {browser: chromium, viewport: tablet-landscape}
          - {browser: chromium, viewport: tablet-portrait}
          - {browser: chromium, viewport: mobile}
          - {browser: chromium, viewport: mobile-narrow}
          - {browser: firefox, viewport: mobile}
          - {browser: webkit, viewport: mobile}
    env:
      AUDIT_BROWSER: ${{ matrix.browser }}
      AUDIT_VIEWPORT: ${{ matrix.viewport }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install browser
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps "$AUDIT_BROWSER"
      - name: Start authenticated preview proxy
        run: |
          set -Eeuo pipefail
          python scripts/vercel-share-proxy.py >/tmp/techgrity-preview-proxy.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json"
      - name: Recapture asserted interaction states
        run: python scripts/manual-interaction-recapture.py
      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-preview-interaction-${{ matrix.browser }}-${{ matrix.viewport }}
          path: evidence/manual-interaction-recapture/${{ matrix.browser }}/${{ matrix.viewport }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  pointer-navigation:
    name: Pointer ${{ matrix.browser }} / ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {browser: chromium, viewport: tablet-landscape}
          - {browser: chromium, viewport: tablet-portrait}
          - {browser: chromium, viewport: mobile}
          - {browser: chromium, viewport: mobile-narrow}
          - {browser: firefox, viewport: mobile}
          - {browser: webkit, viewport: mobile}
    env:
      AUDIT_BROWSER: ${{ matrix.browser }}
      AUDIT_VIEWPORT: ${{ matrix.viewport }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install browser
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps "$AUDIT_BROWSER"
      - name: Start authenticated preview proxy
        run: |
          set -Eeuo pipefail
          python scripts/vercel-share-proxy.py >/tmp/techgrity-preview-proxy.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json"
      - name: Exercise real pointer navigation on every route
        run: python scripts/manual-pointer-navigation-all-routes.py
      - name: Assert corrected navigation behavior
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          def pixels(value):
              match=re.fullmatch(r'(-?\d+(?:\.\d+)?)px',str(value or ''))
              return float(match.group(1)) if match else None

          def intersects(rect, width, height):
              return bool(rect and rect['right']>0 and rect['left']<width and rect['bottom']>0 and rect['top']<height)

          path=Path('evidence/manual-pointer-navigation')/os.environ['AUDIT_BROWSER']/os.environ['AUDIT_VIEWPORT']/'manifest.json'
          data=json.loads(path.read_text())
          failures=[]
          viewport=data['viewport']
          for record in data['records']:
              for state in record.get('states',[]):
                  opened,closed,before=state['opened'],state['closed'],state['before']
                  position=state['position']
                  route=record['route']
                  before_y=before.get('scrollY',0)
                  opened_styles=opened.get('bodyInlineStyles',{})
                  closed_styles=closed.get('bodyInlineStyles',{})

                  if opened.get('expanded')!='true' or not opened.get('navOpenClass') or not opened.get('intersectsViewport'):
                      failures.append({'route':route,'position':position,'code':'open-state','state':state})
                  if not intersects(opened.get('toggleRect'),viewport['width'],viewport['height']):
                      failures.append({'route':route,'position':position,'code':'open-toggle-hidden','toggle':opened.get('toggleRect')})

                  all_items=opened.get('allTopItems',[])
                  visible_items=opened.get('visibleTopItems',[])
                  if len(all_items)<8 or visible_items!=all_items:
                      failures.append({'route':route,'position':position,'code':'hidden-items','all':all_items,'visible':visible_items})

                  dataset_y=opened.get('bodyDatasetScrollY')
                  top_px=pixels(opened_styles.get('top'))
                  if not opened.get('bodyLocked') or opened_styles.get('position')!='fixed':
                      failures.append({'route':route,'position':position,'code':'lock-state','opened':opened})
                  if dataset_y is None or abs(float(dataset_y)-before_y)>1:
                      failures.append({'route':route,'position':position,'code':'lock-saved-scroll','before':before_y,'saved':dataset_y})
                  if top_px is None or abs(top_px+before_y)>1:
                      failures.append({'route':route,'position':position,'code':'lock-offset','before':before_y,'top':opened_styles.get('top')})

                  before_anchor=before.get('anchorRect')
                  opened_anchor=opened.get('anchorRect')
                  if not before_anchor or not opened_anchor or before.get('anchorToken')!=opened.get('anchorToken'):
                      failures.append({'route':route,'position':position,'code':'anchor-missing','before':before_anchor,'opened':opened_anchor})
                  elif abs(opened_anchor['top']-before_anchor['top'])>1 or abs(opened_anchor['left']-before_anchor['left'])>1:
                      failures.append({'route':route,'position':position,'code':'anchor-moved-open','before':before_anchor,'opened':opened_anchor})

                  if closed.get('expanded')!='false' or closed.get('navOpenClass') or closed.get('bodyLocked'):
                      failures.append({'route':route,'position':position,'code':'close-state','state':state})
                  if closed.get('bodyDatasetScrollY') is not None or any(closed_styles.values()):
                      failures.append({'route':route,'position':position,'code':'lock-styles-retained','closed':closed})
                  if not closed.get('activeIsMenuToggle'):
                      failures.append({'route':route,'position':position,'code':'focus-not-returned','closed':closed})
                  if abs(closed.get('scrollY',0)-before_y)>1:
                      failures.append({'route':route,'position':position,'code':'scroll-not-restored','before':before_y,'closed':closed.get('scrollY')})

                  closed_anchor=closed.get('anchorRect')
                  if not before_anchor or not closed_anchor or abs(closed_anchor['top']-before_anchor['top'])>1 or abs(closed_anchor['left']-before_anchor['left'])>1:
                      failures.append({'route':route,'position':position,'code':'anchor-moved-close','before':before_anchor,'closed':closed_anchor})

          print(json.dumps({'failures':failures},indent=2))
          if failures: raise SystemExit(f'{len(failures)} pointer-navigation failures')
          PY
      - name: Upload pointer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-preview-pointer-${{ matrix.browser }}-${{ matrix.viewport }}
          path: evidence/manual-pointer-navigation/${{ matrix.browser }}/${{ matrix.viewport }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
