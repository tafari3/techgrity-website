name: Corrected Preview Certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: techgrity-preview-certification-${{ github.ref }}
  cancel-in-progress: true

env:
  AUDIT_UPSTREAM_URL: https://techgrity-systems-live-iy0yc3v8f-tafarac3-7447s-projects.vercel.app
  VERCEL_SHARE_URL: https://techgrity-systems-live-iy0yc3v8f-tafarac3-7447s-projects.vercel.app/?_vercel_share=UvRXX8egeqgsgLsp0Pnm5m7Gg2z5Qltd
  AUDIT_BASE_URL: http://127.0.0.1:4180
  EXPECTED_RELEASE_SHA: 62caa0a773bb8a95bdab4edda2a6963a640a9fbd
  AUDIT_CANONICAL_BASE: https://techgrity.co.zw

jobs:
  bounded-certification:
    name: Bounded exact-preview certification
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install all certification dependencies once
        run: |
          set -Eeuo pipefail
          npm ci
          npm install --no-save axe-core@4.10.3
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium firefox webkit

      - name: Start one authenticated preview session
        run: |
          set -Eeuo pipefail
          python scripts/vercel-share-proxy.py >/tmp/techgrity-preview-proxy.log 2>&1 &
          echo $! >/tmp/techgrity-preview-proxy.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json" >/tmp/release.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/release.json
          cat /tmp/release.json

      - name: Verify exact preview release
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = os.environ["AUDIT_BASE_URL"].rstrip("/") + "/release.json"
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = json.load(response)
          print(json.dumps(payload, indent=2))
          if payload.get("commit") != os.environ["EXPECTED_RELEASE_SHA"]:
              raise SystemExit("Preview release SHA mismatch")
          PY

      - name: Make canonical expectation preview-aware
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/post-deployment-regression-audit.py")
          text = path.read_text()
          anchor = 'BASE = os.environ.get("AUDIT_BASE_URL", "https://techgrity.co.zw").rstrip("/")'
          replacement = anchor + '\nCANONICAL_BASE = os.environ.get("AUDIT_CANONICAL_BASE", "https://techgrity.co.zw").rstrip("/")'
          if "CANONICAL_BASE =" not in text:
              text = text.replace(anchor, replacement)
          text = text.replace(
              'canonical_expected = f"{BASE}{route}"',
              'canonical_expected = f"{CANONICAL_BASE}{route}"',
          )
          path.write_text(text)
          PY

      - name: Run quality and delivery certification
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json"
          python scripts/exhaustive-live-audit.py
          python scripts/post-deployment-regression-audit.py
          python scripts/production-quality-audit.py
          python scripts/normalize-production-audit.py
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("evidence/normalized-production-audit/summary.json").read_text())
          findings = json.loads(Path("evidence/normalized-production-audit/findings.json").read_text())
          result = {
              "summary": summary,
              "findingCount": len(findings),
              "findings": findings,
          }
          Path("evidence/preview-quality-classification.json").write_text(
              json.dumps(result, indent=2)
          )
          print(json.dumps(result, indent=2))
          severity = summary.get("severityCounts", {})
          if any(severity.get(level, 0) for level in ("critical", "high")):
              raise SystemExit("Corrected preview retains blocking quality findings")
          PY

      - name: Capture all visual lanes sequentially
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json"
          while read -r browser viewport mode; do
            echo "VISUAL_LANE browser=$browser viewport=$viewport mode=$mode"
            AUDIT_BROWSER="$browser" \
            AUDIT_VIEWPORT="$viewport" \
            AUDIT_CAPTURE_MODE="$mode" \
              python scripts/manual-visual-capture.py
          done <<'LANES'
          chromium desktop-wide scroll
          chromium desktop scroll
          chromium desktop-compact scroll
          chromium tablet-landscape scroll
          chromium tablet-portrait scroll
          chromium mobile scroll
          chromium mobile-narrow scroll
          firefox desktop full-only
          firefox mobile full-only
          webkit desktop full-only
          webkit mobile full-only
          LANES

      - name: Assert every visual manifest
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          expected = [
              ("chromium", "desktop-wide"),
              ("chromium", "desktop"),
              ("chromium", "desktop-compact"),
              ("chromium", "tablet-landscape"),
              ("chromium", "tablet-portrait"),
              ("chromium", "mobile"),
              ("chromium", "mobile-narrow"),
              ("firefox", "desktop"),
              ("firefox", "mobile"),
              ("webkit", "desktop"),
              ("webkit", "mobile"),
          ]
          failures = []
          summaries = []
          for browser, viewport in expected:
              path = Path("evidence/manual-visual") / browser / viewport / "manifest.json"
              if not path.exists():
                  failures.append({"browser": browser, "viewport": viewport, "code": "manifest-missing"})
                  continue
              data = json.loads(path.read_text())
              records = data.get("records", [])
              if len(records) != 35:
                  failures.append({
                      "browser": browser,
                      "viewport": viewport,
                      "code": "route-count",
                      "actual": len(records),
                  })
              error_count = data.get("errorCount", 0)
              if error_count:
                  failures.append({
                      "browser": browser,
                      "viewport": viewport,
                      "code": "capture-errors",
                      "errorCount": error_count,
                  })
              for record in records:
                  metrics = record.get("finalMetrics", {})
                  scroll_width = metrics.get("scrollWidth", 0)
                  client_width = metrics.get("clientWidth", 0)
                  if scroll_width > client_width + 1:
                      failures.append({
                          "browser": browser,
                          "viewport": viewport,
                          "route": record.get("route"),
                          "code": "horizontal-overflow",
                          "scrollWidth": scroll_width,
                          "clientWidth": client_width,
                      })
              summaries.append({
                  "browser": browser,
                  "viewport": viewport,
                  "recordCount": len(records),
                  "errorCount": error_count,
              })
          result = {"lanes": summaries, "failures": failures}
          Path("evidence/corrected-preview-visual-summary.json").write_text(
              json.dumps(result, indent=2)
          )
          print(json.dumps(result, indent=2))
          if failures:
              raise SystemExit(f"{len(failures)} visual certification failures")
          PY

      - name: Exercise all interaction lanes sequentially
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json"
          while read -r browser viewport; do
            echo "INTERACTION_LANE browser=$browser viewport=$viewport"
            AUDIT_BROWSER="$browser" \
            AUDIT_VIEWPORT="$viewport" \
              python scripts/manual-interaction-recapture.py
          done <<'LANES'
          chromium desktop
          firefox desktop
          webkit desktop
          chromium tablet-landscape
          chromium tablet-portrait
          chromium mobile
          chromium mobile-narrow
          firefox mobile
          webkit mobile
          LANES

      - name: Assert every interaction manifest
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          expected = [
              ("chromium", "desktop"),
              ("firefox", "desktop"),
              ("webkit", "desktop"),
              ("chromium", "tablet-landscape"),
              ("chromium", "tablet-portrait"),
              ("chromium", "mobile"),
              ("chromium", "mobile-narrow"),
              ("firefox", "mobile"),
              ("webkit", "mobile"),
          ]
          failures = []
          summaries = []
          for browser, viewport in expected:
              path = (
                  Path("evidence/manual-interaction-recapture")
                  / browser
                  / viewport
                  / "manifest.json"
              )
              if not path.exists():
                  failures.append({"browser": browser, "viewport": viewport, "code": "manifest-missing"})
                  continue
              data = json.loads(path.read_text())
              records = data.get("records", [])
              error_count = data.get("errorCount", 0)
              if len(records) != 35:
                  failures.append({
                      "browser": browser,
                      "viewport": viewport,
                      "code": "route-count",
                      "actual": len(records),
                  })
              if error_count:
                  failures.append({
                      "browser": browser,
                      "viewport": viewport,
                      "code": "interaction-errors",
                      "errorCount": error_count,
                  })
              summaries.append({
                  "browser": browser,
                  "viewport": viewport,
                  "recordCount": len(records),
                  "errorCount": error_count,
              })
          result = {"lanes": summaries, "failures": failures}
          Path("evidence/corrected-preview-interaction-summary.json").write_text(
              json.dumps(result, indent=2)
          )
          print(json.dumps(result, indent=2))
          if failures:
              raise SystemExit(f"{len(failures)} interaction certification failures")
          PY

      - name: Exercise all pointer-navigation lanes sequentially
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json"
          while read -r browser viewport; do
            echo "POINTER_LANE browser=$browser viewport=$viewport"
            AUDIT_BROWSER="$browser" \
            AUDIT_VIEWPORT="$viewport" \
              python scripts/manual-pointer-navigation-all-routes.py
          done <<'LANES'
          chromium tablet-landscape
          chromium tablet-portrait
          chromium mobile
          chromium mobile-narrow
          firefox mobile
          webkit mobile
          LANES

      - name: Assert every pointer-navigation manifest
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          expected = [
              ("chromium", "tablet-landscape"),
              ("chromium", "tablet-portrait"),
              ("chromium", "mobile"),
              ("chromium", "mobile-narrow"),
              ("firefox", "mobile"),
              ("webkit", "mobile"),
          ]

          def pixels(value):
              match = re.fullmatch(r"(-?\d+(?:\.\d+)?)px", str(value or ""))
              return float(match.group(1)) if match else None

          def intersects(rect, width, height):
              return bool(
                  rect
                  and rect["right"] > 0
                  and rect["left"] < width
                  and rect["bottom"] > 0
                  and rect["top"] < height
              )

          failures = []
          summaries = []
          for browser, viewport_label in expected:
              path = (
                  Path("evidence/manual-pointer-navigation")
                  / browser
                  / viewport_label
                  / "manifest.json"
              )
              if not path.exists():
                  failures.append({
                      "browser": browser,
                      "viewport": viewport_label,
                      "code": "manifest-missing",
                  })
                  continue
              data = json.loads(path.read_text())
              records = data.get("records", [])
              error_count = data.get("errorCount", 0)
              viewport = data["viewport"]
              if len(records) != 35:
                  failures.append({
                      "browser": browser,
                      "viewport": viewport_label,
                      "code": "route-count",
                      "actual": len(records),
                  })
              if error_count:
                  failures.append({
                      "browser": browser,
                      "viewport": viewport_label,
                      "code": "pointer-errors",
                      "errorCount": error_count,
                  })
              for record in records:
                  for state in record.get("states", []):
                      opened = state["opened"]
                      closed = state["closed"]
                      before = state["before"]
                      position = state["position"]
                      route = record["route"]
                      before_y = before.get("scrollY", 0)
                      opened_styles = opened.get("bodyInlineStyles", {})
                      closed_styles = closed.get("bodyInlineStyles", {})

                      def fail(code, **detail):
                          failures.append({
                              "browser": browser,
                              "viewport": viewport_label,
                              "route": route,
                              "position": position,
                              "code": code,
                              **detail,
                          })

                      if (
                          opened.get("expanded") != "true"
                          or not opened.get("navOpenClass")
                          or not opened.get("intersectsViewport")
                      ):
                          fail("open-state")
                      if not intersects(
                          opened.get("toggleRect"),
                          viewport["width"],
                          viewport["height"],
                      ):
                          fail("open-toggle-hidden", toggle=opened.get("toggleRect"))

                      all_items = opened.get("allTopItems", [])
                      visible_items = opened.get("visibleTopItems", [])
                      if len(all_items) < 8 or visible_items != all_items:
                          fail("hidden-items", all=all_items, visible=visible_items)

                      dataset_y = opened.get("bodyDatasetScrollY")
                      top_px = pixels(opened_styles.get("top"))
                      if (
                          not opened.get("bodyLocked")
                          or opened_styles.get("position") != "fixed"
                      ):
                          fail("lock-state")
                      if dataset_y is None or abs(float(dataset_y) - before_y) > 1:
                          fail("lock-saved-scroll", before=before_y, saved=dataset_y)
                      if top_px is None or abs(top_px + before_y) > 1:
                          fail("lock-offset", before=before_y, top=opened_styles.get("top"))

                      before_anchor = before.get("anchorRect")
                      opened_anchor = opened.get("anchorRect")
                      if (
                          not before_anchor
                          or not opened_anchor
                          or before.get("anchorToken") != opened.get("anchorToken")
                      ):
                          fail("anchor-missing")
                      elif (
                          abs(opened_anchor["top"] - before_anchor["top"]) > 1
                          or abs(opened_anchor["left"] - before_anchor["left"]) > 1
                      ):
                          fail("anchor-moved-open")

                      if (
                          closed.get("expanded") != "false"
                          or closed.get("navOpenClass")
                          or closed.get("bodyLocked")
                      ):
                          fail("close-state")
                      if closed.get("bodyDatasetScrollY") is not None or any(
                          closed_styles.values()
                      ):
                          fail("lock-styles-retained")
                      if not closed.get("activeIsMenuToggle"):
                          fail("focus-not-returned")
                      if abs(closed.get("scrollY", 0) - before_y) > 1:
                          fail(
                              "scroll-not-restored",
                              before=before_y,
                              closed=closed.get("scrollY"),
                          )

                      closed_anchor = closed.get("anchorRect")
                      if (
                          not before_anchor
                          or not closed_anchor
                          or abs(closed_anchor["top"] - before_anchor["top"]) > 1
                          or abs(closed_anchor["left"] - before_anchor["left"]) > 1
                      ):
                          fail("anchor-moved-close")

              summaries.append({
                  "browser": browser,
                  "viewport": viewport_label,
                  "recordCount": len(records),
                  "errorCount": error_count,
              })

          result = {"lanes": summaries, "failures": failures}
          Path("evidence/corrected-preview-pointer-summary.json").write_text(
              json.dumps(result, indent=2)
          )
          print(json.dumps(result, indent=2))
          if failures:
              raise SystemExit(f"{len(failures)} pointer-navigation failures")
          PY

      - name: Write exact-preview certification record
        if: success()
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error "$AUDIT_BASE_URL/release.json" >/tmp/final-release.json
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          release = json.loads(Path("/tmp/final-release.json").read_text())
          record = {
              "status": "pass",
              "certifiedAt": datetime.now(timezone.utc).isoformat(),
              "expectedReleaseSha": os.environ["EXPECTED_RELEASE_SHA"],
              "observedRelease": release,
              "routeCount": 35,
              "visualLanes": 11,
              "interactionLanes": 9,
              "pointerLanes": 6,
              "authenticationModel": "one bounded Vercel share-cookie session",
          }
          Path("evidence/corrected-preview-certification.json").write_text(
              json.dumps(record, indent=2)
          )
          print(json.dumps(record, indent=2))
          PY

      - name: Upload complete exact-preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-preview-bounded-certification
          path: |
            evidence/exhaustive-live-audit/
            evidence/post-deployment-audit/
            evidence/production-quality-audit/
            evidence/normalized-production-audit/
            evidence/preview-quality-classification.json
            evidence/manual-visual/
            evidence/corrected-preview-visual-summary.json
            evidence/manual-interaction-recapture/
            evidence/corrected-preview-interaction-summary.json
            evidence/manual-pointer-navigation/
            evidence/corrected-preview-pointer-summary.json
            evidence/corrected-preview-certification.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Show proxy diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "=== release marker ==="
          curl --silent --show-error -i "$AUDIT_BASE_URL/release.json"
          echo
          echo "=== proxy log tail ==="
          tail -n 200 /tmp/techgrity-preview-proxy.log
