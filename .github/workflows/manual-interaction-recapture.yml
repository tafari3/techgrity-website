name: Manual Interaction Recapture

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/manual-interaction-recapture.py
      - .github/workflows/manual-interaction-recapture.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: techgrity-manual-interaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recapture:
    name: ${{ matrix.browser }} / ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - browser: chromium
            viewport: desktop
          - browser: firefox
            viewport: desktop
          - browser: webkit
            viewport: desktop
          - browser: chromium
            viewport: tablet-landscape
          - browser: chromium
            viewport: tablet-portrait
          - browser: chromium
            viewport: mobile
          - browser: chromium
            viewport: mobile-narrow
          - browser: firefox
            viewport: mobile
          - browser: webkit
            viewport: mobile
    env:
      AUDIT_BASE_URL: https://techgrity.co.zw
      EXPECTED_RELEASE_SHA: a729d9f1df31acd9835bad9ee7b78408bf3d9672
      AUDIT_BROWSER: ${{ matrix.browser }}
      AUDIT_VIEWPORT: ${{ matrix.viewport }}
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install browser dependencies
        run: |
          set -Eeuo pipefail
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps "${AUDIT_BROWSER}"

      - name: Recapture and assert every interaction state
        run: python scripts/manual-interaction-recapture.py

      - name: Upload verified interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-interaction-${{ matrix.browser }}-${{ matrix.viewport }}
          path: evidence/manual-interaction-recapture/${{ matrix.browser }}/${{ matrix.viewport }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
