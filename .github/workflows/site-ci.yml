name: Website CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Materialize approved assets once
        if: ${{ github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && hashFiles('public/assets/techgrity-primary-horizontal-approved.png') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          sed -n '/^          set -euo pipefail$/,/^      - name: Commit materialised assets$/p' .github/workflows/materialize-assets.yml | sed 's/^          //' | sed '$d' > /tmp/materialize-assets.sh
          bash /tmp/materialize-assets.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Store approved website assets directly'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build and validate site
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install browser test dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run browser QA
        run: python scripts/browser-qa.py

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-evidence
          path: evidence/runtime/
          if-no-files-found: warn
          retention-days: 14
