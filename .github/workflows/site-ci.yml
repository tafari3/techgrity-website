name: Website CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build and validate site
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install browser test dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run browser QA
        run: python scripts/browser-qa.py

      - name: Run exhaustive exact-head candidate audit
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run serve > /tmp/techgrity-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/healthz
          AUDIT_BASE_URL=http://127.0.0.1:4173 python scripts/exhaustive-candidate-audit.py
          AUDIT_BASE_URL=http://127.0.0.1:4173 python scripts/review-regression-audit.py

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-evidence
          path: |
            evidence/runtime/
            evidence/candidate-audit/
          if-no-files-found: warn
          retention-days: 14
