name: Apply Audit Remediation

on:
  push:
    branches: [audit/post-deployment-20260803]
    paths:
      - scripts/apply-audit-remediation.py
      - .github/workflows/apply-audit-remediation.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/apply-audit-remediation.py
      - .github/workflows/apply-audit-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: techgrity-apply-audit-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: audit/post-deployment-20260803
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply deterministic remediation
        run: python scripts/apply-audit-remediation.py

      - name: Build and validate corrected source
        run: |
          set -Eeuo pipefail
          npm run build
          npm run validate
          npm run test:forms
          npm run test:server

      - name: Commit corrected product source
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No remediation changes were produced."
            exit 1
          fi
          git commit -m "fix: remediate exhaustive production audit findings"
          git push origin HEAD:audit/post-deployment-20260803
