          cp public/assets/reference/hero-tower.jpg public/assets/reference/hero-tower-clean.jpg
          test "$(sha256sum public/assets/reference/hero-tower-clean.jpg | awk '{print $1}')" = bb80cdfb1606042910e4314e1991bd24ab248b6cff67516e097afcd15ba8d0d1
          rm -rf asset-data
          rm -f .github/workflows/materialize-assets.yml
      - name: Commit materialised assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Store approved website assets directly'
          git push origin HEAD:agent/production-site-foundation
