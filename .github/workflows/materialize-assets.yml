name: Materialize Approved Website Assets

on:
  push:
    branches:
      - agent/production-site-foundation

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify approved assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/reference
          fetch(){ url="$1"; path="$2"; expected="$3"; curl --retry 3 --retry-delay 1 -fsSL "$url" -o "$path"; actual="$(sha256sum "$path" | awk '{print $1}')"; test "$actual" = "$expected" || { echo "hash mismatch for $path: $actual" >&2; exit 1; }; }
          fetch 'https://sdmntprukwest.oaiusercontent.com/files/00000000-4c74-8243-9ff4-17b7db1cf67f/raw?se=2026-07-29T16:15:16Z&sp=r&sv=2026-02-06&sr=b&scid=55b62fff-2677-5d9b-95c3-5c1c882438ab&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-29T08:55:14Z&ske=2026-07-31T08:55:14Z&sks=b&skv=2026-02-06&sig=yBi6W6Htg2h//2i7w32ZtJVsbBsBuko1JyD5L3T%2BUSA%3D' public/assets/favicon.png 10bc2cdbd547dc41f14253dc2b2188d4c7e3532c7ffa749c60db386d924504db
