name: Materialize Approved Website Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify approved assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/reference
          while IFS='|' read -r path expected url; do
            curl --retry 3 --retry-delay 1 -fsSL "$url" -o "$path"
            actual="$(sha256sum "$path" | awk '{print $1}')"
            test "$actual" = "$expected" || { echo "hash mismatch for $path: $actual" >&2; exit 1; }
