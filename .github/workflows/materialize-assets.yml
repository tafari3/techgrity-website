          fetch 'https://sdmntprukwest.oaiusercontent.com/files/00000000-2f8c-8243-8311-dd9fbdfbb895/raw?se=2026-07-29T16:14:32Z&sp=r&sv=2026-02-06&sr=b&scid=5cbd2684-8f60-5112-9cd4-628f411570d5&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-29T07:10:42Z&ske=2026-07-31T07:10:42Z&sks=b&skv=2026-02-06&sig=HU//NzkA0/jWvB8he%2BrOivJGRU%2BELIzjze%2BB87lXQfI%3D' public/assets/reference/cap-technical.jpg 1aabd38509bf3836aec88fbb12f99d1d74e738ad80940212d9d632f0b97101db
