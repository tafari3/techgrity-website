name: Production Website Audit

on:
  push:
    branches: [audit/post-deployment-20260803]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: Production origin to audit
        required: true
        default: https://techgrity.co.zw
      expected_release_sha:
        description: Release SHA expected from release.json
        required: true
        default: a729d9f1df31acd9835bad9ee7b78408bf3d9672

permissions:
  contents: read

jobs:
  audit-production:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AUDIT_BASE_URL: ${{ github.event.inputs.base_url || 'https://techgrity.co.zw' }}
      EXPECTED_RELEASE_SHA: ${{ github.event.inputs.expected_release_sha || 'a729d9f1df31acd9835bad9ee7b78408bf3d9672' }}
    steps:
      - name: Checkout audit head
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install audit dependencies
        run: |
          set -Eeuo pipefail
          npm install
          npm install --no-save axe-core@4.10.3
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium firefox webkit

      - name: Verify audited production release
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url=os.environ['AUDIT_BASE_URL'].rstrip('/')+'/release.json'
          with urllib.request.urlopen(url, timeout=30) as response:
              payload=json.load(response)
          actual=payload.get('commit')
          expected=os.environ['EXPECTED_RELEASE_SHA']
          print(json.dumps({'url':url,'expected':expected,'actual':actual},indent=2))
          if actual != expected:
              raise SystemExit('Production release SHA does not match the audit boundary.')
          PY

      - name: Run original exhaustive live matrix
        run: python scripts/exhaustive-live-audit.py

      - name: Run post-deployment blind-spot matrix
        run: python scripts/post-deployment-regression-audit.py

      - name: Run accessibility performance and browser matrix
        run: python scripts/production-quality-audit.py

      - name: Normalize verified instrumentation exceptions
        run: python scripts/normalize-production-audit.py

      - name: Classify normalized production findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          normalized=json.loads(Path('evidence/normalized-production-audit/summary.json').read_text())
          exhaustive=json.loads(Path('evidence/exhaustive-live-audit/summary.json').read_text())
          supplemental=json.loads(Path('evidence/post-deployment-audit/summary.json').read_text())
          quality=json.loads(Path('evidence/production-quality-audit/summary.json').read_text())
          result={'normalized':normalized,'exhaustive':exhaustive,'supplemental':supplemental,'quality':quality}
          print(json.dumps(result,indent=2))
          Path('evidence/production-audit-classification.json').write_text(json.dumps(result,indent=2))

          severity=normalized.get('severityCounts',{})
          if severity.get('critical',0) or severity.get('high',0):
              raise SystemExit(
                  f"Production audit found blocking defects: critical={severity.get('critical',0)}, high={severity.get('high',0)}"
              )
          PY

      - name: Upload complete production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: techgrity-production-audit
          path: |
            evidence/exhaustive-live-audit/
            evidence/post-deployment-audit/
            evidence/production-quality-audit/
            evidence/normalized-production-audit/
            evidence/production-audit-classification.json
          if-no-files-found: error
          retention-days: 30
