name: Production Website Audit

on:
  push:
    branches: [audit/post-deployment-20260803]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: Production origin to audit
        required: true
        default: https://techgrity.co.zw
      expected_release_sha:
        description: Release SHA expected from release.json
        required: true
        default: a729d9f1df31acd9835bad9ee7b78408bf3d9672

permissions:
  contents: read

jobs:
  audit-production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AUDIT_BASE_URL: ${{ github.event.inputs.base_url || 'https://techgrity.co.zw' }}
      EXPECTED_RELEASE_SHA: ${{ github.event.inputs.expected_release_sha || 'a729d9f1df31acd9835bad9ee7b78408bf3d9672' }}
    steps:
      - name: Checkout audit head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install browser audit dependencies
        run: |
          set -Eeuo pipefail
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Verify audited production release
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url=os.environ['AUDIT_BASE_URL'].rstrip('/')+'/release.json'
          with urllib.request.urlopen(url, timeout=30) as response:
              payload=json.load(response)
          actual=payload.get('commit')
          expected=os.environ['EXPECTED_RELEASE_SHA']
          print(json.dumps({'url':url,'expected':expected,'actual':actual},indent=2))
          if actual != expected:
              raise SystemExit('Production release SHA does not match the audit boundary.')
          PY

      - name: Run original exhaustive live matrix
        run: python scripts/exhaustive-live-audit.py

      - name: Run post-deployment blind-spot matrix
        run: python scripts/post-deployment-regression-audit.py

      - name: Classify production findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          exhaustive=json.loads(Path('evidence/exhaustive-live-audit/summary.json').read_text())
          supplemental=json.loads(Path('evidence/post-deployment-audit/summary.json').read_text())
          result={'exhaustive':exhaustive,'supplemental':supplemental}
          print(json.dumps(result,indent=2))

          blocking=[]
          exhaustive_severity=exhaustive.get('severityCounts',{})
          if exhaustive_severity.get('critical',0) or exhaustive_severity.get('high',0):
              blocking.append('exhaustive critical/high route findings')
          for key in ['interactionFailureCount','formFailureCount','consoleMessageCount','brokenLinkCount']:
              if exhaustive.get(key,0):
                  blocking.append(f'exhaustive {key}={exhaustive[key]}')
          supplemental_severity=supplemental.get('severityCounts',{})
          if supplemental_severity.get('critical',0) or supplemental_severity.get('high',0):
              blocking.append('supplemental critical/high findings')
          if supplemental.get('consoleMessageCount',0):
              blocking.append(f"supplemental consoleMessageCount={supplemental['consoleMessageCount']}")

          Path('evidence/production-audit-classification.json').write_text(
              json.dumps({'blocking':blocking,'result':result},indent=2)
          )
          if blocking:
              raise SystemExit('Production audit found blocking defects: '+', '.join(blocking))
          PY

      - name: Upload complete production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: techgrity-production-audit
          path: |
            evidence/exhaustive-live-audit/
            evidence/post-deployment-audit/
            evidence/production-audit-classification.json
          if-no-files-found: error
          retention-days: 30
