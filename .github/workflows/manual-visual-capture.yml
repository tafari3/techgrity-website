name: Manual Visual Capture Matrix

on:
  push:
    branches: [audit/post-deployment-20260803]
    paths:
      - scripts/manual-visual-capture.py
      - .github/workflows/manual-visual-capture.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/manual-visual-capture.py
      - .github/workflows/manual-visual-capture.yml
  workflow_dispatch:
    inputs:
      base_url:
        description: Production origin to capture
        required: true
        default: https://techgrity.co.zw
      expected_release_sha:
        description: Expected production release SHA
        required: true
        default: a729d9f1df31acd9835bad9ee7b78408bf3d9672

permissions:
  contents: read

concurrency:
  group: techgrity-manual-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: ${{ matrix.browser }} / ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - browser: chromium
            viewport: desktop-wide
            mode: scroll
          - browser: chromium
            viewport: desktop
            mode: scroll
          - browser: chromium
            viewport: desktop-compact
            mode: scroll
          - browser: chromium
            viewport: tablet-landscape
            mode: scroll
          - browser: chromium
            viewport: tablet-portrait
            mode: scroll
          - browser: chromium
            viewport: mobile
            mode: scroll
          - browser: chromium
            viewport: mobile-narrow
            mode: scroll
          - browser: firefox
            viewport: desktop
            mode: full-only
          - browser: firefox
            viewport: mobile
            mode: full-only
          - browser: webkit
            viewport: desktop
            mode: full-only
          - browser: webkit
            viewport: mobile
            mode: full-only
    env:
      AUDIT_BASE_URL: ${{ github.event.inputs.base_url || 'https://techgrity.co.zw' }}
      EXPECTED_RELEASE_SHA: ${{ github.event.inputs.expected_release_sha || 'a729d9f1df31acd9835bad9ee7b78408bf3d9672' }}
      AUDIT_BROWSER: ${{ matrix.browser }}
      AUDIT_VIEWPORT: ${{ matrix.viewport }}
      AUDIT_CAPTURE_MODE: ${{ matrix.mode }}
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install capture dependencies
        run: |
          set -Eeuo pipefail
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps "${AUDIT_BROWSER}"

      - name: Verify production release boundary
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url=os.environ['AUDIT_BASE_URL'].rstrip('/')+'/release.json'
          with urllib.request.urlopen(url, timeout=30) as response:
              payload=json.load(response)
          actual=payload.get('commit')
          expected=os.environ['EXPECTED_RELEASE_SHA']
          print(json.dumps({'url':url,'expected':expected,'actual':actual},indent=2))
          if actual != expected:
              raise SystemExit('Production release SHA does not match the manual-audit boundary.')
          PY

      - name: Capture every route and scroll state
        run: python scripts/manual-visual-capture.py

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-visual-${{ matrix.browser }}-${{ matrix.viewport }}
          path: evidence/manual-visual/${{ matrix.browser }}/${{ matrix.viewport }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
