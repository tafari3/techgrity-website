name: Manual Visual Capture Matrix

on:
  push:
    branches: [audit/post-deployment-20260803]
    paths:
      - scripts/manual-visual-capture.py
      - .github/workflows/manual-visual-capture.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/manual-visual-capture.py
      - .github/workflows/manual-visual-capture.yml
  workflow_dispatch:
    inputs:
      base_url:
        description: Audit origin to capture
        required: true
        default: https://techgrity.co.zw
      expected_release_sha:
        description: Expected release SHA
        required: true
        default: a729d9f1df31acd9835bad9ee7b78408bf3d9672

permissions:
  contents: read
  id-token: write

concurrency:
  group: techgrity-manual-visual-${{ github.ref }}
  cancel-in-progress: true

env:
  AUDIT_PROJECT_NAME: techgrity-final-audit-2b77b7fd
  AUDIT_TEAM_ID: team_rGXRfIoc1yeEl7S3CKES0IzD

jobs:
  repair-review-access:
    name: Isolated review access repair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PR_BODY: ${{ github.event.pull_request.body || '' }}
    steps:
      - name: Disable SSO only on isolated audit project when token exists
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, re, urllib.error, urllib.parse, urllib.request

          token = os.environ.get('VERCEL_TOKEN', '').strip()
          body = os.environ.get('PR_BODY', '')
          project = os.environ['AUDIT_PROJECT_NAME']
          team_id = os.environ['AUDIT_TEAM_ID']
          review_match = re.search(
              r'(?:preview|review) URL:\s*\[[^\]]+\]\((https://[a-z0-9-]+\.vercel\.app/?)\)',
              body,
              flags=re.IGNORECASE,
          )
          review_url = review_match.group(1).rstrip('/') if review_match else ''
          safe_target = bool(re.fullmatch(
              rf'https://{re.escape(project)}-[a-z0-9-]+\.vercel\.app',
              review_url,
              flags=re.IGNORECASE,
          ))
          print(f'VERCEL_TOKEN_CONFIGURED={bool(token)}')
          print(f'ISOLATED_REVIEW_TARGET_CONFIRMED={safe_target}')
          if not token:
              print('ISOLATED_SSO_REPAIR=skipped-no-vercel-token')
              raise SystemExit(0)
          if not safe_target:
              raise SystemExit('Refusing Vercel write: PR review URL is not the isolated audit project.')

          url = (
              'https://api.vercel.com/v9/projects/'
              + urllib.parse.quote(project, safe='')
              + '?teamId=' + urllib.parse.quote(team_id, safe='')
          )
          payload = json.dumps({'ssoProtection': None}).encode('utf-8')
          request = urllib.request.Request(
              url,
              data=payload,
              method='PATCH',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json',
                  'User-Agent': 'Techgrity-Isolated-Review-Access-Repair/1.0',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = int(response.status)
                  raw = response.read(4096)
          except urllib.error.HTTPError as error:
              status = int(error.code)
              raw = error.read(4096)
          except urllib.error.URLError as error:
              print(f'ISOLATED_SSO_REPAIR=network-error:{type(error.reason).__name__}')
              raise SystemExit('Vercel project update could not be reached.')

          classification = 'unknown'
          try:
              parsed = json.loads(raw.decode('utf-8', 'replace') or '{}')
              classification = (
                  parsed.get('error', {}).get('code')
                  or parsed.get('error', {}).get('message')
                  or parsed.get('code')
                  or 'json-response'
              )
          except Exception:
              classification = 'non-json-response' if raw else 'empty-response'
          print(f'ISOLATED_SSO_REPAIR_HTTP={status}')
          print(f'ISOLATED_SSO_REPAIR_CLASS={str(classification)[:160]}')
          if status < 200 or status >= 300:
              raise SystemExit('Existing VERCEL_TOKEN could not disable SSO on the isolated audit project.')
          print('ISOLATED_SSO_REPAIR=success')
          PY

  capture:
    name: ${{ matrix.browser }} / ${{ matrix.viewport }}
    needs: [repair-review-access]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - browser: chromium
            viewport: desktop-wide
            mode: scroll
          - browser: chromium
            viewport: desktop
            mode: scroll
          - browser: chromium
            viewport: desktop-compact
            mode: scroll
          - browser: chromium
            viewport: tablet-landscape
            mode: scroll
          - browser: chromium
            viewport: tablet-portrait
            mode: scroll
          - browser: chromium
            viewport: mobile
            mode: scroll
          - browser: chromium
            viewport: mobile-narrow
            mode: scroll
          - browser: firefox
            viewport: desktop
            mode: full-only
          - browser: firefox
            viewport: mobile
            mode: full-only
          - browser: webkit
            viewport: desktop
            mode: full-only
          - browser: webkit
            viewport: mobile
            mode: full-only
    env:
      AUDIT_BASE_URL: ${{ github.event.inputs.base_url || 'https://techgrity.co.zw' }}
      EXPECTED_RELEASE_SHA: ${{ github.event.inputs.expected_release_sha || 'a729d9f1df31acd9835bad9ee7b78408bf3d9672' }}
      AUDIT_BROWSER: ${{ matrix.browser }}
      AUDIT_VIEWPORT: ${{ matrix.viewport }}
      AUDIT_CAPTURE_MODE: ${{ matrix.mode }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Resolve remote audit target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          INPUT_BASE_URL: ${{ github.event.inputs.base_url || '' }}
          INPUT_EXPECTED_RELEASE_SHA: ${{ github.event.inputs.expected_release_sha || '' }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import os, re
          from pathlib import Path

          production_url = 'https://techgrity.co.zw'
          production_sha = 'a729d9f1df31acd9835bad9ee7b78408bf3d9672'
          base_url = os.environ.get('INPUT_BASE_URL') or production_url
          expected_sha = os.environ.get('INPUT_EXPECTED_RELEASE_SHA') or production_sha
          source = 'workflow-input' if os.environ.get('INPUT_BASE_URL') else 'production-default'

          if os.environ.get('EVENT_NAME') == 'pull_request':
              body = os.environ.get('PR_BODY', '')
              review_match = re.search(
                  r'(?:preview|review) URL:\s*\[[^\]]+\]\((https://[a-z0-9-]+\.vercel\.app/?)\)',
                  body,
                  flags=re.IGNORECASE,
              )
              sha_match = re.search(
                  r'Current rendered product candidate SHA:\s*`([0-9a-f]{40})`',
                  body,
                  flags=re.IGNORECASE,
              )
              if review_match and sha_match:
                  base_url = review_match.group(1).rstrip('/')
                  expected_sha = sha_match.group(1).lower()
                  source = 'pr-review-boundary'

          if not re.fullmatch(r'https://(?:[a-z0-9-]+\.vercel\.app|techgrity\.co\.zw)', base_url, flags=re.IGNORECASE):
              raise SystemExit(f'Unsupported audit origin: {base_url}')
          if not re.fullmatch(r'[0-9a-f]{40}', expected_sha):
              raise SystemExit(f'Invalid expected release SHA: {expected_sha}')

          github_env = Path(os.environ['GITHUB_ENV'])
          with github_env.open('a', encoding='utf-8') as handle:
              handle.write(f'AUDIT_BASE_URL={base_url}\n')
              handle.write(f'EXPECTED_RELEASE_SHA={expected_sha}\n')
          print(f'AUDIT_TARGET_SOURCE={source}')
          print(f'AUDIT_BASE_URL={base_url}')
          print(f'EXPECTED_RELEASE_SHA={expected_sha}')
          print(f'VERCEL_AUTOMATION_BYPASS_CONFIGURED={bool(os.environ.get("VERCEL_AUTOMATION_BYPASS_SECRET", "").strip())}')
          PY

      - name: Mint trusted GitHub OIDC identity
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.exportVariable('VERCEL_TRUSTED_OIDC_TOKEN', token);
            core.info('VERCEL_TRUSTED_OIDC_CONFIGURED=true');

      - name: Install capture dependencies
        run: |
          set -Eeuo pipefail
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps "${AUDIT_BROWSER}"

      - name: Verify release boundary
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, re, urllib.error, urllib.request

          url = os.environ['AUDIT_BASE_URL'].rstrip('/') + '/release.json'
          expected = os.environ['EXPECTED_RELEASE_SHA']
          bypass = os.environ.get('VERCEL_AUTOMATION_BYPASS_SECRET', '').strip()
          trusted_oidc = os.environ.get('VERCEL_TRUSTED_OIDC_TOKEN', '').strip()
          headers = {'Accept': 'application/json', 'User-Agent': 'Techgrity-Release-Boundary-Audit/1.0'}
          if bypass:
              headers['x-vercel-protection-bypass'] = bypass
              headers['x-vercel-set-bypass-cookie'] = 'true'
          if trusted_oidc:
              headers['x-vercel-trusted-oidc-idp-token'] = trusted_oidc
          request = urllib.request.Request(url, headers=headers)

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = int(response.status)
                  final_url = response.geturl()
                  content_type = response.headers.get('Content-Type', '')
                  raw = response.read(65536)
          except urllib.error.HTTPError as error:
              status = int(error.code)
              final_url = error.geturl()
              content_type = error.headers.get('Content-Type', '') if error.headers else ''
              raw = error.read(65536)
          except urllib.error.URLError as error:
              print(json.dumps({'url': url, 'classification': 'network-error', 'reason': str(error.reason)[:300]}, indent=2))
              raise SystemExit('Release boundary could not be reached.')

          text = raw.decode('utf-8', 'replace')
          lower = re.sub(r'\s+', ' ', text).strip().lower()
          protection = {}
          try:
              candidate = json.loads(text)
              if isinstance(candidate, dict) and isinstance(candidate.get('protection'), dict):
                  protection = {k:v for k,v in candidate['protection'].items() if k in {'vercel_auth_enabled','password_enabled','auto_vercel_auth_redirect'}}
          except json.JSONDecodeError:
              pass
          vercel_auth = protection.get('vercel_auth_enabled') is True or 'protected deployment' in lower
          print(json.dumps({
              'url': url,
              'finalUrl': final_url,
              'status': status,
              'contentType': content_type,
              'automationBypassConfigured': bool(bypass),
              'trustedOidcConfigured': bool(trusted_oidc),
              'protection': protection,
              'bodyPrefix': re.sub(r'\s+', ' ', text).strip()[:500],
          }, indent=2))
          if status < 200 or status >= 300:
              if status == 401 and vercel_auth:
                  raise SystemExit('Vercel Authentication still protects the isolated review target after all configured bypass/repair paths.')
              raise SystemExit(f'Release boundary returned HTTP {status}.')
          try:
              payload = json.loads(text)
          except json.JSONDecodeError:
              raise SystemExit('Release boundary is not JSON.')
          actual = payload.get('commit')
          route_count = payload.get('routeCount')
          print(json.dumps({'classification':'release-marker-json','expected':expected,'actual':actual,'routeCount':route_count}, indent=2))
          if actual != expected:
              raise SystemExit('Release SHA does not match the manual-audit boundary.')
          if route_count != 35:
              raise SystemExit(f'Expected 35 routes, observed release marker {route_count!r}.')
          PY

      - name: Capture every route and scroll state
        run: python scripts/manual-visual-capture.py

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-visual-${{ matrix.browser }}-${{ matrix.viewport }}
          path: evidence/manual-visual/${{ matrix.browser }}/${{ matrix.viewport }}/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
