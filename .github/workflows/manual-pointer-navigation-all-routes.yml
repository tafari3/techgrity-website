name: Manual Pointer Navigation Matrix

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/manual-pointer-navigation-all-routes.py
      - .github/workflows/manual-pointer-navigation-all-routes.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: techgrity-pointer-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pointer-navigation:
    name: ${{ matrix.browser }} / ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - browser: chromium
            viewport: tablet-landscape
          - browser: chromium
            viewport: tablet-portrait
          - browser: chromium
            viewport: mobile
          - browser: chromium
            viewport: mobile-narrow
          - browser: firefox
            viewport: mobile
          - browser: webkit
            viewport: mobile
    env:
      AUDIT_BROWSER: ${{ matrix.browser }}
      AUDIT_VIEWPORT: ${{ matrix.viewport }}
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install browser dependencies
        run: |
          set -Eeuo pipefail
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps "${AUDIT_BROWSER}"
      - name: Exercise pointer navigation on every route
        run: python scripts/manual-pointer-navigation-all-routes.py
      - name: Upload pointer navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-pointer-navigation-${{ matrix.browser }}-${{ matrix.viewport }}
          path: evidence/manual-pointer-navigation/${{ matrix.browser }}/${{ matrix.viewport }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
